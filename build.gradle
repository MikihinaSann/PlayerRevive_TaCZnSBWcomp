plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

loom {
	mixin {
		defaultRefmapName = "playerrevive_compat.refmap.json"
	}
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		// Forge Config API Port (Fuzs)
		url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven { url "https://maven.shedaniel.me/" } // cloth config api
	maven {
		name = "KosmX's maven" // player-animation-lib
		url = 'https://maven.kosmx.dev/'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// PlayerRevive (Fabric) + TACZ-Refabricated - local jars, remapped by Loom
	modImplementation files("libs/playerrevive-fabric-2.1.3.jar")
	modImplementation files("libs/tacz-refabricated-1.21.1-0.7.1.jar")

	// CreativeCore - required by PlayerRevive's network API
	modImplementation "curse.maven:creativecore-257814:${project.creativecore_version}"

	// Forge Config API Port - provides ModConfigSpec on Fabric
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_version}"

	// Runtime dependencies of TACZ-Refabricated so runClient works
	modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_fabric}"
	modRuntimeOnly "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animation_lib}"
	modRuntimeOnly "curse.maven:shoulder-surfing-reloaded-243190:${project.shoulder_surfing_id}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
